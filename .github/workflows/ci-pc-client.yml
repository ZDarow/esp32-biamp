name: 'CI: клиент для ПК'

on:
  push:
    branches: [main, pc-client-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменять предыдущий прогон при новом коммите в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Файл принадлежит направлению pc-client — см. docs/BRANCHING.md.
jobs:
  pc-client:
    name: Клиент ПК (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: pc-client

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # fetch-depth: 1 — без истории. Раньше стояло значение по умолчанию
          # (полный клон), и при force-push'е ветки runner не обновлял локальную
          # копию: оставался транспорт v34 с длинными строками, а ruff падал на
          # нём, хотя blob в репозитории был чистым. Без истории force-push
          # не оставляет мусора, и каждый прогон берёт точную версию коммита.
          fetch-depth: 1

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pc-client/requirements.txt
            pc-client/requirements-dev.txt

      - name: Установка зависимостей
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Инструменты анализа — из requirements-dev.txt с ТОЧНЫМИ версиями.
          # Раньше стояло `pip install ruff mypy`: без фиксации набор правил
          # ruff и тексты ошибок mypy менялись между прогонами, и одна и та же
          # правка могла проходить у разработчика и падать здесь.
          pip install -r requirements-dev.txt

      # Тесты написаны на unittest из стандартной библиотеки: pytest ради трёх
      # файлов не нужен. Запуск идёт из корня pc-client, иначе пакет biamp
      # не находится в sys.path.
      - name: Линтер (ruff)
        run: ruff check .

      - name: Форматирование (ruff)
        run: ruff format --check .

      - name: Проверка типов (mypy)
        run: mypy

      - name: Юнит-тесты
        run: python -m unittest discover -s tests -t . -v