name: 'CI: приложение Android'

on:
  push:
    branches: [main, android-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменять предыдущий прогон при новом коммите в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Файл принадлежит направлению android — см. docs/BRANCHING.md.
jobs:
  android:
    name: Приложение (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Раньше стояла версия v1: у gradle/actions нет тега v1, action лежит в
      # подкаталоге setup-gradle, и запуск падал на разборе action.yml до
      # начала сборки. Актуальная мажорная версия — v4.
      - name: Установка Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Указание пути к Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Сборка, линтер и тесты объединены в один вызов: separate gradle invocations
      # без setup-gradle запускают каждый раз новый демон, что медленно и
      # кэш не переиспользуется. setup-gradle управляет демоном и кешем.
      - name: Сборка, статический анализ и юнит-тесты
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest

      - name: Выгрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error