name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для выпуска (например v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Сборка выпуска
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5

      - name: Определение тега
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Выпуск: $TAG"

      # ── Прошивка ──────────────────────────────────────────────
      - name: Установка arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Подготовка sketchbook
        run: |
          export ARDUINO_DIRECTORIES_USER="$PWD/.arduino"
          echo "ARDUINO_DIRECTORIES_USER=$PWD/.arduino" >> "$GITHUB_ENV"
          mkdir -p "$PWD/.arduino/libraries"

      - name: Установка ядра и библиотек
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          # audio-tools и ESP32-A2DP отсутствуют в реестре Arduino —
          # публикуются только на GitHub, поэтому клонируются напрямую.
          git clone --depth 1 --quiet https://github.com/pschatzmann/arduino-audio-tools.git \
            "$ARDUINO_DIRECTORIES_USER/libraries/audio-tools"
          git clone --depth 1 --quiet https://github.com/pschatzmann/ESP32-A2DP.git \
            "$ARDUINO_DIRECTORIES_USER/libraries/ESP32-A2DP"
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306"

      - name: Сборка прошивки
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,UploadSpeed=921600" \
            --build-path "$PWD/.build/firmware" \
            firmware/ESP32_BiAmp

      - name: Упаковка прошивки в ZIP
        run: |
          VERSION="${{ steps.meta.outputs.tag }}"
          BIN="$PWD/.build/firmware/ESP32_BiAmp.ino.bin"
          if [ ! -f "$BIN" ]; then
            echo "::error::Не найден скомпилированный образ $BIN"
            exit 1
          fi
          mkdir -p release
          cp "$BIN" "release/firmware-$VERSION.bin"
          cp "$PWD/.build/firmware/ESP32_BiAmp.ino.elf" "release/firmware-$VERSION.elf" 2>/dev/null || true
          cp firmware/DOCUMENTATION.md "release/DOCUMENTATION-$VERSION.md"
          (cd release && zip -r "../esp32-biamp-$VERSION.zip" .)
          ls -la "esp32-biamp-$VERSION.zip"

      # ── Приложение ────────────────────────────────────────────
      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Указание пути к Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      - name: Сборка APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleRelease

      # В build.gradle.kts не задана signingConfig, поэтому AGP собирает
      # app-release-unsigned.apk. Подписывающий ключ в репозитории нет
      # и храниться он должен в секретах, а не в коде.
      - name: Подготовка APK к выпуску
        run: |
          SRC=$(find android-app/app/build/outputs/apk/release -name 'app-release*.apk' | head -n1)
          if [ -z "$SRC" ]; then
            echo "::error::APK release не собран"
            exit 1
          fi
          echo "Собран: $SRC"
          cp "$SRC" "app-esp32-biamp-${{ steps.meta.outputs.tag }}.apk"

      - name: Выгрузка APK в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ESP32 Bi-Amp ${{ steps.meta.outputs.tag }}
          body: |
            ## Что в выпуске

            | Файл | Назначение |
            |---|---|
            | `esp32-biamp-${{ steps.meta.outputs.tag }}.zip` | Образ прошивки, символы, документация |
            | `app-esp32-biamp-${{ steps.meta.outputs.tag }}.apk` | Android-приложение |

            > ⚠️ APK **не подписан**: ключ хранится в секретах репозитория,
            > а не в коде. Самостоятельная сборка из исходников не требует
            > подписи — `assembleDebug` даёт устанавливаемый файл.

            ## Как прошить

            Извлеките образ из архива и прошейте его через USB:

            ```bash
            esptool.py --chip esp32 --port COM5 --baud 921600 \
              write_flash 0x10000 "firmware-${{ steps.meta.outputs.tag }}.bin"
            ```

            ## Как установить приложение

            ```bash
            # Либо соберите сами — подпись не требуется:
            cd android-app && ./gradlew assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            ```

            Подробности — в [README](https://github.com/${{ github.repository }}#установка).

          files: |
            esp32-biamp-${{ steps.meta.outputs.tag }}.zip
            app-esp32-biamp-${{ steps.meta.outputs.tag }}.apk
          fail_on_unmatched_files: true
