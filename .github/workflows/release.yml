name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для выпуска (например v1.0.0)'
        required: true

permissions:
  contents: read

# Те же зафиксированные версии, что и в ci-*: выпуск обязан собираться тем же
# кодом, который прошёл CI, иначе артефакты выпуска и проверки разъезжаются.
env:
  ARDUINO_CLI_VERSION: '1.5.1'
  ARDUINO_CLI_SHA256: '28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b'
  ESP32_CORE_VERSION: '3.3.12'
  AUDIO_TOOLS_TAG: 'v1.2.5'
  AUDIO_TOOLS_COMMIT: '2390c44fac3bdd1df40b80a088f00c9a203053b9'
  A2DP_TAG: 'v1.8.11'
  A2DP_COMMIT: 'b6da4744286ca15b6f1dee607c077a4747294dd4'

# Выпуск — точка интеграции направлений, поэтому здесь он один, но шаги
# разделены по независимым job'ам: правка прошивки и правка приложения больше
# не делят один шаг и одну последовательность. Сам файл принадлежит
# интеграции — см. docs/BRANCHING.md.
jobs:
  # ─────────────────────────────────────────────────────────────
  # Образ прошивки
  # ─────────────────────────────────────────────────────────────
  firmware:
    name: 'Выпуск: прошивка'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5

      - name: Определение тега
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Выпуск: $TAG"

      - name: Установка arduino-cli
        run: |
          set -euo pipefail
          URL="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSL "$URL" -o /tmp/arduino-cli.tar.gz
          echo "${ARDUINO_CLI_SHA256}  /tmp/arduino-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli

      - name: Подготовка sketchbook
        run: |
          export ARDUINO_DIRECTORIES_USER="$PWD/.arduino"
          echo "ARDUINO_DIRECTORIES_USER=$PWD/.arduino" >> "$GITHUB_ENV"
          mkdir -p "$PWD/.arduino/libraries"

      - name: Установка ядра и библиотек
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          # audio-tools и ESP32-A2DP отсутствуют в реестре Arduino —
          # публикуются только на GitHub, поэтому клонируются напрямую.
          # По тегу и с проверкой хеша: тег переставить можно, хеш — нет.
          fetch() {
            git clone --depth 1 --branch "$2" --quiet "$1" "$4"
            got="$(git -C "$4" rev-parse HEAD)"
            if [ "$got" != "$3" ]; then
              echo "::error::Тег $2 в $1 указывает на $got вместо $3"
              exit 1
            fi
          }
          fetch https://github.com/pschatzmann/arduino-audio-tools.git \
            "$AUDIO_TOOLS_TAG" "$AUDIO_TOOLS_COMMIT" \
            "$ARDUINO_DIRECTORIES_USER/libraries/audio-tools"
          fetch https://github.com/pschatzmann/ESP32-A2DP.git \
            "$A2DP_TAG" "$A2DP_COMMIT" \
            "$ARDUINO_DIRECTORIES_USER/libraries/ESP32-A2DP"
          arduino-cli lib install "Adafruit GFX Library@1.12.6" "Adafruit SSD1306@2.5.17"

      - name: Сборка прошивки
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,UploadSpeed=921600" \
            --build-path "$PWD/.build/firmware" \
            firmware/ESP32_BiAmp

      - name: Упаковка прошивки в ZIP
        run: |
          VERSION="${{ steps.meta.outputs.tag }}"
          BIN="$PWD/.build/firmware/ESP32_BiAmp.ino.bin"
          if [ ! -f "$BIN" ]; then
            echo "::error::Не найден скомпилированный образ $BIN"
            exit 1
          fi
          mkdir -p release
          cp "$BIN" "release/firmware-$VERSION.bin"
          cp "$PWD/.build/firmware/ESP32_BiAmp.ino.elf" "release/firmware-$VERSION.elf" 2>/dev/null || true
          cp firmware/DOCUMENTATION.md "release/DOCUMENTATION-$VERSION.md"
          (cd release && zip -r "../esp32-biamp-$VERSION.zip" .)
          ls -la "esp32-biamp-$VERSION.zip"

      - name: Выгрузка архива прошивки
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: esp32-biamp-${{ steps.meta.outputs.tag }}.zip
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Android-приложение
  # ─────────────────────────────────────────────────────────────
  android:
    name: 'Выпуск: приложение'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5

      - name: Определение тега
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Выпуск: $TAG"

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Кэширование Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-app/**/*.gradle.kts', 'android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Указание пути к Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Восстановление ключа подписи
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Секрет ANDROID_KEYSTORE_BASE64 не задан — выпуск без подписи недопустим"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/biamp-release.p12"
          chmod 600 "$RUNNER_TEMP/biamp-release.p12"
          # Свойства Gradle с точками нельзя передать через ORG_GRADLE_PROJECT_*,
          # поэтому имена без точек; см. app/build.gradle.kts
          {
            echo "ORG_GRADLE_PROJECT_biampStoreFile=$RUNNER_TEMP/biamp-release.p12"
            echo "ORG_GRADLE_PROJECT_biampStorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ORG_GRADLE_PROJECT_biampKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ORG_GRADLE_PROJECT_biampKeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "Ключ подписи восстановлен"

      - name: Сборка APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Проверка подписи APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Ожидался подписанный $APK, найдено: $(ls app/build/outputs/apk/release/)"
            exit 1
          fi
          echo "APK собран и подписан: $APK"

      - name: Подготовка APK к выгрузке
        run: |
          # Ниже в files указан app-esp32-biamp-$TAG.apk, а Gradle кладёт
          # app-release.apk. Без этого переименования шаг выгрузки падал бы
          # на fail_on_unmatched_files: выпуск не создавался вовсе.
          TAG="${{ steps.meta.outputs.tag }}"
          cp "app/build/outputs/apk/release/app-release.apk" \
             "../app-esp32-biamp-$TAG.apk"
          ls -la "../app-esp32-biamp-$TAG.apk"

      - name: Выгрузка APK как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: app-esp32-biamp-${{ steps.meta.outputs.tag }}.apk
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Сборка релиза из артефактов обоих направлений
  # ─────────────────────────────────────────────────────────────
  upload:
    name: Публикация выпуска
    needs: [firmware, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Сборка файлов выпуска
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp "artifacts/release-firmware/esp32-biamp-$TAG.zip" .
          cp "artifacts/release-android/app-esp32-biamp-$TAG.apk" .
          ls -la "esp32-biamp-$TAG.zip" "app-esp32-biamp-$TAG.apk"

      - name: Публикация в GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ESP32 Bi-Amp ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Что в выпуске

            | Файл | Назначение |
            |---|---|
            | `esp32-biamp-${{ github.event.inputs.tag || github.ref_name }}.zip` | Образ прошивки, символы, документация |
            | `app-esp32-biamp-${{ github.event.inputs.tag || github.ref_name }}.apk` | Android-приложение, подписано |

            ## Как прошить

            Извлеките образ из архива и прошейте его через USB:

            ```bash
            esptool.py --chip esp32 --port COM5 --baud 921600 \
              write_flash 0x10000 "firmware-${{ github.event.inputs.tag || github.ref_name }}.bin"
            ```

            ## Установка приложения

            ```bash
            adb install -r "app-esp32-biamp-${{ github.event.inputs.tag || github.ref_name }}.apk"
            ```

            Сборка из исходников подписи не требует:

            ```bash
            cd android-app && ./gradlew assembleDebug
            ```

            Подробности — в [README](https://github.com/${{ github.repository }}/blob/main/README.md).

          files: |
            esp32-biamp-${{ github.event.inputs.tag || github.ref_name }}.zip
            app-esp32-biamp-${{ github.event.inputs.tag || github.ref_name }}.apk
          fail_on_unmatched_files: true