name: 'CI: гигиена'

on:
  push:
    branches: [main, firmware-dev, android-dev, pc-client-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменять предыдущий прогон при новом коммите в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Проверки сквозные: они читают весь репозиторий, но не принадлежат ни одному
# направлению и потому живут отдельно от остальных workflow.
jobs:
  hygiene:
    name: Гигиена репозитория
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Полная история обязательна: gitleaks-action в режиме частичного
          # сканирования вычисляет ревизию вида `^..` — родителя первого
          # коммита. При fetch-depth: 1 он не загружен, git отклоняет
          # неразрешимую ревизию, и проверка падает с
          # "failed to scan Git repository: stderr is not empty"
          fetch-depth: 0

      - name: Проверка на секреты
        # v3 — версия на Node 24. v2 работает на Node 20, который выведен
        # из GitHub-hosted runners, и перестаёт поддерживаться.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Проверка лицензии
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::Файл LICENSE отсутствует"
            exit 1
          fi
          # Проверяем первые 10 строк: в GPL-3.0 титульный ряд и номер
          # версии могут оказаться не в самой первой строке из-за отступов.
          head -n 10 LICENSE | grep -q "GNU GENERAL PUBLIC LICENSE" \
            || { echo "::error::LICENSE не содержит текста GPL-3.0"; exit 1; }
          head -n 10 LICENSE | grep -q "Version 3" \
            || { echo "::error::LICENSE не является версией 3 GPL"; exit 1; }
          echo "LICENSE на месте, лицензия GPL-3.0"

      - name: Проверка запрещённых файлов
        run: |
          # Список основан на .gitattributes (binary) и правилах безопасности:
          # секреты, ключи, отладочные файлы и артефакты сборки не должны
          # оказаться в репозитории.
          BAD=$(git ls-files | grep -Ei '\.(pcap|pcapng)$|^log\.txt$|^local\.properties$|^gh_(out|err)\.txt$|\.env$|\.pem$|\.key$|\.keystore$|^credentials\.json$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::В репозитории обнаружены запрещённые файлы:"
            echo "$BAD"
            exit 1
          fi
          echo "Запрещённых файлов нет"

      - name: Проверка переводов строк
        run: |
          # Проверяем ИНДЕКС, а не рабочее дерево: именно индекс определяет,
          # что попадёт в следующий коммит. Разница между ними не случайна.
          # .gitattributes помечает `gradlew.bat text eol=crlf`, и при чекауте
          # этот файл получает CRLF законно — батник для Windows обязан иметь
          # CRLF. В индексе он лежит с LF, как и все остальные файлы.
          # Прежняя проверка смотрела на рабочее дерево и потому сообщала
          # о gradlew.bat как об ошибке: она наказывала за собственное
          # правило .gitattributes. На Linux с чекаутом то же самое —
          # расхождение воспроизводилось в CI, и проверка была красной
          # на неизменённом файле из первого коммита.
          #
          # Смысл проверки — не дать закоммитить CRLF, а не наказать за
          # корректно настроенный eol. Индекс отвечает на первый вопрос,
          # рабочее дерево — на второй, и отвечает неверно.
          #
          # `git ls-files --eol` вместо `git grep` с $'\r' по трём причинам.
          #  1. Ответ приходит из индекса, то есть про то, что уйдёт в
          #     коммит, — без конвертации .gitattributes при чекауте.
          #  2. Статус готов из коробки: lf, crlf, mixed, none, -text.
          #     Сравнение строк надёжно, тогда как $'\r' внутри YAML-скрипта
          #     проходит через несколько слоёв экранирования, и однажды
          #     распадался до пустого паттерна — тогда grep -l печатал
          #     каждый файл репозитория и проверка краснела ни о чём.
          #  3. Видно и mixed, а не только crlf: смешанные окончания строк
          #     ловятся бесплатно, признаком от руки они не выявлялись.
          #
          # Расширения не перечисляются: раньше список был выборочным, и
          # файлы вне него проходили незамеченными.
          #
          # i/none (пустой файл) и i/-text (двоичный, напр. .jar) пропускаются:
          # переводов строк у них нет, и в нарушении их наличие не значит.
          BAD_EOL=$(git ls-files --eol | awk -F'\t' '$1 ~ /^i\/(crlf|mixed)/ { print $2 }')
          if [ -n "$BAD_EOL" ]; then
            echo "::error::В индексе файлы с неверными переводами строк (ожидается LF):"
            echo "$BAD_EOL"
            exit 1
          fi
          echo "Переводы строк в норме"

      # Матрица владения объявлена в трёх файлах: хук, CODEOWNERS и
      # docs/BRANCHING.md. Правят их обычно по одному, и расхождение
      # означает, что коммит из чужой ветки пройдёт молча. Сверка ловит
      # это до попадания на сервер.
      - name: Сверка матрицы владения путями
        shell: pwsh
        run: ./tools/check-owners.ps1