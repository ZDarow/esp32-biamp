name: 'CI: гигиена'

on:
  push:
    branches: [main, firmware-dev, android-dev, pc-client-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменять предыдущий прогон при новом коммите в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Проверки сквозные: они читают весь репозиторий, но не принадлежат ни одному
# направлению и потому живут отдельно от остальных workflow.
jobs:
  hygiene:
    name: Гигиена репозитория
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Полная история обязательна: gitleaks-action в режиме частичного
          # сканирования вычисляет ревизию вида `^..` — родителя первого
          # коммита. При fetch-depth: 1 он не загружен, git отклоняет
          # неразрешимую ревизию, и проверка падает с
          # "failed to scan Git repository: stderr is not empty"
          fetch-depth: 0

      - name: Проверка на секреты
        # v3 — версия на Node 24. v2 работает на Node 20, который выведен
        # из GitHub-hosted runners, и перестаёт поддерживаться.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Проверка лицензии
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::Файл LICENSE отсутствует"
            exit 1
          fi
          # Проверяем первые 10 строк: в GPL-3.0 титульный ряд и номер
          # версии могут оказаться не в самой первой строке из-за отступов.
          head -n 10 LICENSE | grep -q "GNU GENERAL PUBLIC LICENSE" \
            || { echo "::error::LICENSE не содержит текста GPL-3.0"; exit 1; }
          head -n 10 LICENSE | grep -q "Version 3" \
            || { echo "::error::LICENSE не является версией 3 GPL"; exit 1; }
          echo "LICENSE на месте, лицензия GPL-3.0"

      - name: Проверка запрещённых файлов
        run: |
          # Список основан на .gitattributes (binary) и правилах безопасности:
          # секреты, ключи, отладочные файлы и артефакты сборки не должны
          # оказаться в репозитории.
          BAD=$(git ls-files | grep -Ei '\.(pcap|pcapng)$|^log\.txt$|^local\.properties$|^gh_(out|err)\.txt$|\.env$|\.pem$|\.key$|\.keystore$|^credentials\.json$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::В репозитории обнаружены запрещённые файлы:"
            echo "$BAD"
            exit 1
          fi
          echo "Запрещённых файлов нет"

      - name: Проверка переводов строк
        run: |
          git config core.autocrlf false
          # Проверяем ВСЕ текстовые файлы, а не выборочные расширения.
          # -I заставляет git grep пропускать файлы, определяемые как бинарные
          # (работает по эвристике содержимого и правилам .gitattributes).
          # Это покрывает .py, .yml, .xml, .java, .properties, а также файлы
          # без расширения вроде .githooks/pre-commit.
          if git grep -Il $'\r' 2>/dev/null | head -n1 | grep -q .; then
            echo "::error::Обнаружены файлы с CRLF в исходниках:"
            git grep -Il $'\r' 2>/dev/null
            exit 1
          fi
          echo "Переводы строк в норме"

      # Матрица владения объявлена в трёх файлах: хук, CODEOWNERS и
      # docs/BRANCHING.md. Правят их обычно по одному, и расхождение
      # означает, что коммит из чужой ветки пройдёт молча. Сверка ловит
      # это до попадания на сервер.
      - name: Сверка матрицы владения путями
        shell: pwsh
        run: ./tools/check-owners.ps1