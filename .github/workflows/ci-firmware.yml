name: 'CI: прошивка'

on:
  push:
    branches: [main, firmware-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменять предыдущий прогон при новом коммите в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Версии инструментов зафиксированы: сборка вчера и сборка через месяц
# должны давать один и тот же образ. Значения соответствуют локальной
# рабочей сборке v35 и проверяются по тегам и хешам, а не «latest».
# Файл принадлежит направлению firmware — см. docs/BRANCHING.md.
env:
  ARDUINO_CLI_VERSION: '1.5.1'
  ARDUINO_CLI_SHA256: '28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b'
  ESP32_CORE_VERSION: '3.3.12'
  AUDIO_TOOLS_TAG: 'v1.2.5'
  AUDIO_TOOLS_COMMIT: '2390c44fac3bdd1df40b80a088f00c9a203053b9'
  A2DP_TAG: 'v1.8.11'
  A2DP_COMMIT: 'b6da4744286ca15b6f1dee607c077a4747294dd4'

jobs:
  dsp-tests:
    name: Тесты DSP (хост)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Прогон host-тестов DSP
        run: |
          # Биквад, кроссовер и линия задержки против теоретического отклика.
          # Собираются обычным gcc без Arduino и ESP-IDF, поэтому регрессия в
          # формуле DSP видна на PR, где железа и arduino-cli нет.
          # -Wall включён: предупреждения компилятора здесь падают прогон.
          set -euo pipefail
          make -C firmware/tests test-host

      - name: Компиляция с -Werror
        run: |
          # Makefile собирает с -Wall, но без -Werror: локально лишнее
          # предупреждение не должно ронять проверку. В CI проверяем строже.
          set -euo pipefail
          make -C firmware/tests test-host-clean
          for t in golden_biquad golden_crossover golden_delay; do
            gcc -O2 -Wall -Wextra -Werror -o /dev/null "firmware/tests/$t.c" -lm
          done

  firmware:
    name: Прошивка (arduino-cli)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Копирование репозитория
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Установка arduino-cli
        run: |
          # Раньше ставился install.sh с ветки master — он тянул всегда последнюю
          # версию, и падение сборки через месяц невозможно было объяснить diff-ом.
          # Теперь версия и хеш зафиксированы в env выше.
          set -euo pipefail
          URL="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSL "$URL" -o /tmp/arduino-cli.tar.gz
          echo "${ARDUINO_CLI_SHA256}  /tmp/arduino-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli
          arduino-cli version

      - name: Подготовка sketchbook
        run: |
          # Делаем каталог библиотек предсказуемым, чтобы сборка была
          # воспроизводимой и не зависела от настроек раннера.
          export ARDUINO_DIRECTORIES_USER="$PWD/.arduino"
          echo "ARDUINO_DIRECTORIES_USER=$PWD/.arduino" >> "$GITHUB_ENV"
          mkdir -p "$PWD/.arduino/libraries"

      - name: Установка ядра ESP32
        run: |
          # Ядро тоже зафиксировано: без версии arduino-cli ставил новейшую,
          # а поведение ядра между релизами меняется (например, дефолты I2S).
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Установка библиотек
        run: |
          # audio-tools и ESP32-A2DP отсутствуют в официальном реестре Arduino
          # и распространяются только через GitHub, поэтому клонируются напрямую.
          # Клонируем по тегу и сверяем хеш коммита: тег в репозитории в принципе
          # можно переставить, а хеш — нет.
          set -euo pipefail
          fetch() { # url, тег, ожидаемый коммит, каталог
            git clone --depth 1 --branch "$2" --quiet "$1" "$4"
            got="$(git -C "$4" rev-parse HEAD)"
            if [ "$got" != "$3" ]; then
              echo "::error::Тег $2 в $1 указывает на $got вместо $3"
              exit 1
            fi
          }
          fetch https://github.com/pschatzmann/arduino-audio-tools.git \
            "$AUDIO_TOOLS_TAG" "$AUDIO_TOOLS_COMMIT" \
            "$ARDUINO_DIRECTORIES_USER/libraries/audio-tools"
          fetch https://github.com/pschatzmann/ESP32-A2DP.git \
            "$A2DP_TAG" "$A2DP_COMMIT" \
            "$ARDUINO_DIRECTORIES_USER/libraries/ESP32-A2DP"
          # Версии библиотек из реестра фиксируем явно: без этого arduino-cli
          # ставил бы новейшие и сборка могла бы сломаться по чужому релизу.
          # Значения соответствуют локальной рабочей сборке v35.
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "Adafruit SSD1306@2.5.17"

      - name: Сборка прошивки
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,UploadSpeed=921600" \
            --build-path "$PWD/.build/firmware" \
            --warnings all \
            firmware/ESP32_BiAmp

      - name: Проверка размера образа
        run: |
          # Без --build-path arduino-cli собирает во временный каталог,
          # который удаляется сразу после сборки.
          BIN="$PWD/.build/firmware/ESP32_BiAmp.ino.bin"
          if [ ! -f "$BIN" ]; then
            echo "::error::Не найден скомпилированный образ $BIN"
            exit 1
          fi
          SIZE=$(stat -c%s "$BIN")
          LIMIT=3145728
          echo "Размер образа: $SIZE байт из $LIMIT ($(echo "scale=1; $SIZE*100/$LIMIT" | bc)%)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Образ не помещается в раздел huge_app"
            exit 1
          fi

      - name: Выгрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: .build/firmware/ESP32_BiAmp.ino.bin
          retention-days: 14
          if-no-files-found: error