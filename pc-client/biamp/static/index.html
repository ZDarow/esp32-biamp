<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Bi-Amp — управление</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ESP32 Bi-Amp</h1>
  <div class="bar">
    <span id="link" class="badge">не подключено</span>
    <button id="refresh" class="primary">Обновить</button>
  </div>
</header>

<p id="error" class="error" hidden></p>

<main>
  <section>
    <h2>Громкость</h2>
    <div class="row">
      <label>Зона 0 (левая)</label>
      <input type="range" data-field="vol0" min="0" max="100" step="1">
      <output data-out="vol0"></output>
    </div>
    <div class="row">
      <label>Зона 1 (правая)</label>
      <input type="range" data-field="vol1" min="0" max="100" step="1">
      <output data-out="vol1"></output>
    </div>
    <div class="row">
      <label>Баланс</label>
      <input type="range" data-field="balance" min="-10" max="10" step="0.5">
      <output data-out="balance"></output>
    </div>
  </section>

  <section>
    <h2>Кроссовер</h2>
    <div class="row">
      <label>Частота среза</label>
      <input type="range" data-field="crossover_hz" min="200" max="1000" step="10">
      <output data-out="crossover_hz"></output>
    </div>
    <div class="row">
      <label>Срез сабвуфера</label>
      <input type="range" data-field="sub_hp_hz" min="20" max="80" step="1">
      <output data-out="sub_hp_hz"></output>
    </div>
    <div class="row checkbox">
      <label><input type="checkbox" data-field="sub_on"> НЧ-канал включён</label>
    </div>
    <div class="row">
      <label>Тип фильтра</label>
      <select data-field="crossover_type">
        <option value="1">Butterworth 2-го порядка</option>
        <option value="2">Linkwitz-Riley 4-го</option>
      </select>
    </div>
    <div class="row checkbox">
      <label><input type="checkbox" data-field="xo_on"> Кроссовер включён (иначе НЧ и ВЧ идут напрямую)</label>
    </div>
  </section>

  <section>
    <h2>Маршрутизация каналов</h2>
    <div class="row checkbox">
      <label><input type="checkbox" data-field="lr_swap"> Переставить Л/П (вместо инверсии фазы)</label>
    </div>
    <div class="row checkbox">
      <label><input type="checkbox" data-field="dup_out"> Дублировать зону 0 в зону 1</label>
    </div>
    <p id="dup-warn" class="warn" hidden>
      Внимание: при включённом DUP каналы 2 и 3 (правая НЧ/ВЧ) физически молчат.
      Правая акустика не играет.
    </p>
  </section>

  <section>
    <h2>Отключение зон</h2>
    <div class="row checkbox">
      <label><input type="checkbox" data-field="muted_z0"> Зона 0 (левая) — mute</label>
    </div>
    <div class="row checkbox">
      <label><input type="checkbox" data-field="muted_z1"> Зона 1 (правая) — mute</label>
    </div>
  </section>

  <section>
    <h2>Тримы и эквалайзер</h2>
    <div class="row">
      <label>Подъём НЧ</label>
      <input type="range" data-field="tilt_low_db" min="-6" max="3" step="0.5">
      <output data-out="tilt_low_db"></output>
    </div>
    <div class="row">
      <label>Срез ВЧ</label>
      <input type="range" data-field="tilt_high_db" min="-6" max="3" step="0.5">
      <output data-out="tilt_high_db"></output>
    </div>
    <div class="row">
      <label>120 Гц</label>
      <input type="range" data-field="eq_low_db" min="-12" max="12" step="0.5">
      <output data-out="eq_low_db"></output>
    </div>
    <div class="row">
      <label>1000 Гц</label>
      <input type="range" data-field="eq_mid_db" min="-12" max="12" step="0.5">
      <output data-out="eq_mid_db"></output>
    </div>
    <div class="row">
      <label>6000 Гц</label>
      <input type="range" data-field="eq_high_db" min="-12" max="12" step="0.5">
      <output data-out="eq_high_db"></output>
    </div>
  </section>

  <section>
    <h2>Каналы</h2>
    <table id="channels">
      <thead><tr><th>Канал</th><th>HP, Гц</th><th>LP, Гц</th><th>Задержка</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Тест-сигнал</h2>
    <div class="row">
      <label>Громкость теста</label>
      <input type="range" data-field="test_volume" min="0" max="6" step="1">
      <output data-out="test_volume"></output>
    </div>
    <div class="row">
      <label>Режим</label>
      <select id="testmode">
        <option value="off">выключить</option>
        <option value="all">все каналы</option>
        <option value="left">левая зона</option>
        <option value="right">правая зона</option>
        <option value="woofer">НЧ-каналы</option>
        <option value="tweeter">ВЧ-каналы</option>
        <option value="anti">противофазный</option>
        <option value="sweep">свип 20 Гц – 20 кГц</option>
      </select>
      <button data-cmd="apply-test">Применить</button>
    </div>
  </section>

  <section>
    <h2>Служебное</h2>
    <div class="row">
      <button data-cmd="save">Записать в память (NVS)</button>
      <button data-cmd="preset:0">Пресет 0</button>
      <button data-cmd="preset:1">Пресет 1</button>
      <button data-cmd="preset:2">Пресет 2</button>
      <button data-cmd="preset:3">Пресет 3</button>
      <button data-cmd="stats">Счётчики</button>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
