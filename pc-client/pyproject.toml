# Конфигурация статического анализа pc-client.
#
# Зачем файл: без него набор правил определяется версией ruff. Разные версии
# включают разные проверки, поэтому локальный прогон и CI считали бы разное —
# ровно тот класс дефекта, который аудит уже находил в зависимостях
# (незафиксированная pyserial). Набор правил зафиксирован здесь явно.
#
# [project] намеренно отсутствует: pc-client не публикуется в PyPI, а таблица
# [project] заставила бы pip считать каталог дистрибутивом.

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".venv", "build", ".ruff_cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # предупреждения pycodestyle
    "I",    # порядок импортов
    "UP",   # модернизация синтаксиса под target-version
    "B",    # баги (bugbear)
    "SIM",  # упрощение
    "PIE",  # единообразие записи
    "C4",   # comprehensions
    "RET",  # возвраты
    "RUF",  # специфичные правила ruff
]

# Обоснованные исключения. Каждое — с причиной, иначе «выключили и забыли».
# RUF001/RUF002/RUF003 помечают «неоднозначные» символы Unicode: буквы,
# одинаково выглядящие в кириллице и латинице. Проект русскоязычный — текст
# в сообщениях, справке и комментариях состоит из кириллицы по определению,
# и правило даёт тысячи ложных срабатываний на каждом файле.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Тесты обязаны использовать assert: без него проверка не имеет смысла.
"tests/*" = ["B011", "S101"]
# Транспорт обязан глушить исключение при закрытии сокета: исключение из
# close() не должно затирать исходную ошибку соединения, ради которой close()
# и вызывается. Отсюда try/except/pass. SIM105 (contextlib.suppress) тоже
# отключён: рядом стоит комментарий, объясняющий, ПОЧЕМУ исключение глушится,
# и contextlib.suppress этот комментарий сохранить не даёт.
"biamp/transport.py" = ["BLE001", "S110", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["biamp"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["biamp"]
# Полный strict включён явно, а не флагом в CI: правила живут здесь, и
# локальный запуск `mypy` даёт тот же результат, что и `mypy --strict`.
strict = true

# Веб-слой отключён от самых строгих проверок обоснованно:
#  - обработчики BaseHTTPRequestHandler не аннотированы в самой stdlib;
#  - тело запроса — произвольный JSON, значения из него по определению Any,
#    строгая типизация возможна только вместе со схемой.
# Точечное ослабление: остальные модули остаются полностью строгими.
[[tool.mypy.overrides]]
module = "biamp.webapp"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["no-any-return", "arg-type", "type-arg", "index"]
