# Локальные pre-commit хуки: проверяют изменения до коммита.
# Установка: pre-commit install
# Запуск всех: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Запрет CRLF и смешанных переводов строк в исходниках (AGENTS.md §6 / CI)
      - id: mixed-line-ending
        args: [--fix=no]
      # Запрет больших файлов (секреты, логи, артефакты сборки)
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^firmware/tools/.*\.py$
